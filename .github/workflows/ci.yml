name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app scripts tests

      - name: Test
        # The whole suite runs without Bedrock or a database. Those paths are
        # covered by fakes, so CI needs no cloud credentials or services.
        run: pytest
